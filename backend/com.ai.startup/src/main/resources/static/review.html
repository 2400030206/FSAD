<!DOCTYPE html>
<html>
<head>
<title>Review</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Review Answers</h2>

<p id="status"></p>

<button onclick="loadAnswers()">Show Explanation</button>

<p id="answers"></p>

<script>

const currentUser=localStorage.getItem("ai_user");
if(!currentUser){
window.location="index.html";
}

const attemptId=localStorage.getItem("exam_attempt_id");
if(attemptId){
fetch("/api/exam/status?id="+encodeURIComponent(attemptId))
.then(res=>res.text())
.then(data=>{
document.getElementById("status").innerText=data;
});
}

function loadAnswers(){

fetch("/api/review/answers")
.then(res=>res.text())
.then(data=>{
document.getElementById("answers").innerText=data;
});

}

</script>

</body>
</html>
